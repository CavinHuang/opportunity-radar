# Opportunity Radar · 服务器部署编排
# 用法：
#   1. 在同目录创建 .env，至少设置 RADAR_OWNER_TOKEN（强口令，服务暴露到网络时的唯一鉴权）。
#   2. docker compose up -d --build
#   3. 浏览器打开 http://<服务器地址>:4177 ，输入 owner token。
#
# HTTPS：建议前置反向代理（Caddy / Nginx）终止 TLS 后转发到 4177。
# 设置了 RADAR_OWNER_TOKEN 时，应用接受任意 Host（反代场景无需 RADAR_ALLOWED_HOSTS）。
#
# 数据：SQLite（含 WAL）持久化在命名卷 radar-data；升级镜像不丢数据。
# 备份：docker compose exec radar node src/data-cli.mjs backup \
#        --db /app/.data/radar.sqlite --output /app/backups/radar-$(date +%Y%m%d).sqlite

services:
  radar:
    build: .
    # 使用预构建镜像时注释掉 build、改用：
    # image: ghcr.io/cavinhuang/opportunity-radar:latest
    container_name: opportunity-radar
    ports:
      - "${RADAR_PUBLISH_PORT:-4177}:4177"
    environment:
      # 必填：暴露到网络时的唯一 owner 鉴权（不设置则应用启动即报错，见 src/server.mjs:30）
      RADAR_OWNER_TOKEN: ${RADAR_OWNER_TOKEN:?请在 .env 中设置强口令 RADAR_OWNER_TOKEN}
      RADAR_AGENT_TOKEN: ${RADAR_AGENT_TOKEN:-}
      RADAR_HOST: 0.0.0.0
      RADAR_PORT: 4177
      # 可选：信息源 / LLM 起草 / GitHub 证据核验
      RADAR_FEED_URLS: ${RADAR_FEED_URLS:-}
      RADAR_LLM_BASE_URL: ${RADAR_LLM_BASE_URL:-}
      RADAR_LLM_API_KEY: ${RADAR_LLM_API_KEY:-}
      RADAR_LLM_MODEL: ${RADAR_LLM_MODEL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      RADAR_ALLOWED_HOSTS: ${RADAR_ALLOWED_HOSTS:-}
      RADAR_REVIEW_CYCLE_DAYS: ${RADAR_REVIEW_CYCLE_DAYS:-}
    volumes:
      - radar-data:/app/.data
      - ./backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4177/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  radar-data:
