# Opportunity Radar · Dokploy Compose 部署编排
#
# ⚠ Compose 部署类型的关键一步：Dokploy 不会为 Compose 服务自动接通反向代理。
#    下面已预置 dokploy-network 挂载与 Traefik 路由标签——把 radar.example.com
#    换成你的域名后，Dokploy 里 Redeploy 即可通过域名访问（自动 HTTPS）。
#    不用域名时，也可以直接访问服务器 IP:4177（ports 已发布）。
#
# 用法：
#   1. 在 Dokploy 环境变量（或同目录 .env）设置 RADAR_OWNER_TOKEN（强口令，必填）。
#   2. docker compose up -d（本机）或在 Dokploy Redeploy。
#   3. 验证：curl http://127.0.0.1:4177/api/health → {"ok":true,...}
#
# 数据：SQLite（含 WAL）持久化在命名卷 radar-data；升级镜像不丢数据。
# 备份：docker compose exec radar node src/data-cli.mjs backup \
#        --db /app/.data/radar.sqlite --output /app/backups/radar-$(date +%Y%m%d).sqlite

services:
  radar:
    build:
      context: .
      args:
        RADAR_RELEASE_SHA: ${RADAR_RELEASE_SHA:-}
    # GHCR 预构建部署时：删除上面的 build 块，改为 `image: ghcr.io/cavinhuang/opportunity-radar@sha256:<digest>`。
    # 不要使用 latest；预构建镜像的 SHA 已写入镜像环境变量。
    container_name: opportunity-radar
    environment:
      # 必填：暴露到网络时的唯一 owner 鉴权
      RADAR_OWNER_TOKEN: ${RADAR_OWNER_TOKEN:?请在环境变量中设置强口令 RADAR_OWNER_TOKEN}
      RADAR_AGENT_TOKEN: ${RADAR_AGENT_TOKEN:-}
      # Image's RADAR_RELEASE_SHA is baked at build time; never override it with an empty env.
      # 只读外部巡检凭据；不等同 Owner Token
      RADAR_WATCH_TOKEN: ${RADAR_WATCH_TOKEN:-}
      RADAR_HOST: 0.0.0.0
      RADAR_PORT: 4177
      # 可选：信息源 / LLM 起草 / GitHub 证据核验
      RADAR_FEED_URLS: ${RADAR_FEED_URLS:-}
      RADAR_LLM_BASE_URL: ${RADAR_LLM_BASE_URL:-}
      RADAR_LLM_API_KEY: ${RADAR_LLM_API_KEY:-}
      RADAR_LLM_MODEL: ${RADAR_LLM_MODEL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      JEV_API_URL: ${JEV_API_URL:-https://openrouter.ai/~typesafe/jev-latest}
      JEV_MODEL: ${JEV_MODEL:-}
      RADAR_ALLOWED_HOSTS: ${RADAR_ALLOWED_HOSTS:-}
      RADAR_REVIEW_CYCLE_DAYS: ${RADAR_REVIEW_CYCLE_DAYS:-}
    ports:
      - "${RADAR_PUBLISH_PORT:-4177}:4177"
    volumes:
      - radar-data:/app/.data
      - ./backups:/app/backups
    restart: unless-stopped
    networks:
      - dokploy-network
    labels:
      - traefik.enable=true
      # ↓↓↓ 把域名换成你自己的（两处必须一致）↓↓↓
      - traefik.http.routers.radar.rule=Host(`radar.example.com`)
      - traefik.http.routers.radar.entrypoints=websecure
      - traefik.http.routers.radar.tls.certresolver=letsencrypt
      - traefik.http.services.radar.loadbalancer.server.port=4177
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4177/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  radar-data:

networks:
  dokploy-network:
    external: true
