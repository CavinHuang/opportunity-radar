name: Stage verified source discovery v0.6
on:
  push:
    branches:
      - feat/source-discovery-v0.6
permissions:
  contents: write
jobs:
  apply-tested-patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply source patch from local-tested commit
        run: |
          base64 --decode .release/v0.6-code.patch.xz.b64 | xz -d > /tmp/v06.patch
          git apply --check /tmp/v06.patch
          git apply /tmp/v06.patch
      - name: Verify application source
        run: npm run check
      - name: Set up browser screenshots
        run: |
          python -m pip install --disable-pip-version-check pillow playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
      - name: Capture genuine UI against isolated demo SQLite
        run: python scripts/capture_screenshots.py
      - name: Commit application and screenshot assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .release/v0.6-code.patch.xz.b64 .github/workflows/stage-v06.yml
          git add -A
          git commit -m 'feat: real source subscriptions signal inbox and opportunity evidence (v0.6)'
          git push origin HEAD:refs/heads/feat/source-discovery-v0.6
