name: Capture README screenshots
on:
  workflow_dispatch:
  push:
    branches:
      - feat/agent-onboarding-screenshots-v0.5
permissions:
  contents: write
jobs:
  screenshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser screenshot tooling
        run: |
          python -m pip install --disable-pip-version-check pillow playwright
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            python -m playwright install --with-deps chromium
          fi
      - name: Capture actual localized frontend and isolated demo API
        run: python scripts/capture_screenshots.py
      - name: Commit README screenshot assets to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/dashboard-zh.webp docs/screenshots/agent-setup-en.webp
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture actual localized Radar screenshots"
            git push origin HEAD:refs/heads/feat/agent-onboarding-screenshots-v0.5
          fi
