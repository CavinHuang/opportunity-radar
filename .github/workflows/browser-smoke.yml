name: Direct browser E2E
on:
  pull_request:
    paths:
      - 'public/**'
      - 'src/**'
      - 'scripts/browser-smoke.py'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Direct Chromium to real Node HTTP and isolated SQLite
        run: python scripts/browser-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-evidence
          path: artifacts/browser-smoke/
          if-no-files-found: ignore
