name: Independent production watch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-watch.yml'
      - 'scripts/production-watch.mjs'
      - 'scripts/production-watch-acceptance.mjs'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      production_url:
        description: 'Optional HTTPS site origin for a one-time manual check; overrides Actions variable'
        required: false
        type: string
      expected_sha:
        description: 'Optional 40-character deployed SHA; overrides Actions variable'
        required: false
        type: string
      require_rollback_monitoring:
        description: 'Require protected rollout/rollback monitoring (not health-only)'
        required: true
        type: boolean
        default: true
      require_pinned_revision:
        description: 'Require a deployed revision SHA to be explicitly pinned'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  readiness:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HAS_ORIGIN: ${{ vars.RADAR_PRODUCTION_URL != '' }}
      HAS_PIN: ${{ vars.RADAR_EXPECTED_DEPLOY_SHA != '' }}
      HAS_WATCH_TOKEN: ${{ secrets.RADAR_WATCH_TOKEN != '' }}
    steps:
      - name: Explicit external monitoring readiness, no production probe
        run: |
          {
            echo '## Radar production watch · configuration presence'
            echo
            echo '| Requirement | Present |'
            echo '|---|---|'
            echo "| Production HTTPS URL | $HAS_ORIGIN |"
            echo "| Pinned deployment SHA | $HAS_PIN |"
            echo "| Protected watch secret | $HAS_WATCH_TOKEN |"
            echo
            echo '**Presence is not deployment verification.** Confirm a separate live workflow_dispatch / scheduled observation before closing Issue #141.'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$HAS_ORIGIN" != 'true' ]; then
            echo '::warning::Production watch has no configured RADAR_PRODUCTION_URL; not enabled.'
          fi
          if [ "$HAS_WATCH_TOKEN" != 'true' ]; then
            echo '::warning::Only public health monitoring can be verified without protected watch token.'
          fi
  external-watch:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RADAR_PRODUCTION_URL: ${{ inputs.production_url || vars.RADAR_PRODUCTION_URL }}
      RADAR_EXPECTED_DEPLOY_SHA: ${{ inputs.expected_sha || vars.RADAR_EXPECTED_DEPLOY_SHA }}
      RADAR_WATCH_TOKEN: ${{ secrets.RADAR_WATCH_TOKEN }}
      RADAR_WATCH_REPORT: watch-result.json
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Explicitly disclose disabled monitoring
        if: env.RADAR_PRODUCTION_URL == ''
        run: echo "::warning::Production watch disabled. Configure the RADAR_PRODUCTION_URL Actions repository variable."
      - name: Fail manual acceptance when production URL is not configured
        if: github.event_name == 'workflow_dispatch' && env.RADAR_PRODUCTION_URL == ''
        run: |
          echo "::error::Provide production_url on Run workflow, or set RADAR_PRODUCTION_URL in Actions Variables."
          exit 1
      - name: Require complete production evidence for manual acceptance
        if: github.event_name == 'workflow_dispatch' && env.RADAR_PRODUCTION_URL != ''
        env:
          REQUIRE_ROLLBACK: ${{ inputs.require_rollback_monitoring }}
          REQUIRE_SHA: ${{ inputs.require_pinned_revision }}
        run: |
          if [ "$REQUIRE_SHA" = "true" ] && [ -z "$RADAR_EXPECTED_DEPLOY_SHA" ]; then
            echo "::error::Set RADAR_EXPECTED_DEPLOY_SHA or provide expected_sha in the manual workflow."
            exit 1
          fi
          if [ "$REQUIRE_ROLLBACK" = "true" ] && [ -z "$RADAR_WATCH_TOKEN" ]; then
            echo "::error::Set matching RADAR_WATCH_TOKEN in Dokploy and Actions Secrets for full acceptance."
            exit 1
          fi
      - name: Probe public health and optional protected rollout heartbeat
        if: env.RADAR_PRODUCTION_URL != ''
        run: |
          node scripts/production-watch.mjs || test -s "$RADAR_WATCH_REPORT"
      - name: Reconcile production incidents (scheduled canonical monitor only)
        # Manual checks may override the site URL, so they must never create or
        # close incidents for the canonical configured production target.
        if: github.event_name == 'schedule' && env.RADAR_PRODUCTION_URL != ''
        run: node scripts/production-watch-issues.mjs
      - name: Evaluate acceptance evidence (full / limited / failure)
        if: env.RADAR_PRODUCTION_URL != ''
        env:
          RADAR_REQUIRE_ROLLBACK: ${{ inputs.require_rollback_monitoring }}
          RADAR_REQUIRE_PIN: ${{ inputs.require_pinned_revision }}
        run: node scripts/production-watch-acceptance.mjs
